name: Verification
on:
  pull_request:
    branches:
      - develop
      - main
      - master
jobs:
  pre-commit:
    name: pre-commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The ansible-lint pre-commit hook hard-pins language_version:
      # python3.14 in its own .pre-commit-hooks.yaml, so a python3.14
      # interpreter must be resolvable on PATH for pre-commit to build
      # that hook's virtualenv, independent of the 3.11 used to install
      # this repo's own (older-pinned) requirements.txt below.
      - name: Set up Python 3.14 (for ansible-lint pre-commit hook)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python3.11 -m pip install --upgrade pip
          python3.11 -m pip install -r requirements.txt
          python3.11 -m pip install pre-commit
      - name: Run pre-commit checks
        run: python3.11 -m pre_commit run --show-diff-on-failure --color=always --all-files
  molecule:
    name: Molecule Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        molecule_distro:
          - centos9
          - centos10
          - debian11
          - debian12
          - debian13
          - fedora
          - rocky8
          - rocky9
          - rocky10
          - ubuntu1804
          - ubuntu2004
          - ubuntu2204
          - ubuntu2404
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pre-commit
      - name: Test with molecule
        run: |
          molecule test --scenario-name ${{ matrix.molecule_distro }}
